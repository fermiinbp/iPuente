# Integración continua: en cada Pull Request (y push a main) instala, pasa el lint y los tests de la API y comprueba que el front compila. Sin secretos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Una ejecución por rama: si llega un commit nuevo, se cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA (la tag v4 puede moverse).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -w server
      - run: npm run build
        env:
          # Valores ficticios: el build solo exige que existan, no se conecta a Firebase.
          VITE_FIREBASE_API_KEY: ci-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci
